services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnidim
      POSTGRES_USER: omnidim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidim -d omnidim"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OMNIDIM_ENV: production
      DATABASE_SSLMODE: disable
      TRUST_PROXY: "1"
    depends_on:
      db: {condition: service_healthy}
    networks: [private, outbound]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
  gateway:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway_config:/config
    depends_on: [app]
    networks: [private, outbound]
networks:
  private: {internal: true}
  outbound: {}
volumes:
  database:
  certificates:
  gateway_config:
