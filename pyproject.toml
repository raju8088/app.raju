[project]
name = "omnidim-control-center"
version = "1.0.0"
description = "Workspace-based hosted console and local browser UI for OmniDimension voice-agent APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OmniDimension Community" }]
dependencies = [
    "Django==5.2.18", "asgiref==3.12.1", "sqlparse==0.6.0", "tzdata==2026.5",
    "cryptography==50.0.2", "cffi==2.1.1", "pycparser==3.0",
    "psycopg[binary]==3.3.6", "psycopg-binary==3.3.6", "typing_extensions==4.16.0",
    "whitenoise==6.12.0", "packaging==26.3",
]

[tool.vercel]
entrypoint = "omnidim_portal.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py check --deploy --fail-level WARNING"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=omnidim_ui --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["omnidim_ui"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["omnidim_ui"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
